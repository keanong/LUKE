apply plugin: 'com.android.application'

android {
    signingConfigs {
        config {
            keyAlias 'LukeKey'
            keyPassword '12321qwE'
            storeFile file('D:/Kean Projects/Android projects/306/Luke 303 onwards/Luke wo routing as of v 243/LUKE/app/Luke.jks')
            storePassword '12321qwE'
        }
    }

    namespace "com.xdel.luke"

    /*compileSdkVersion 29
    buildToolsVersion '28.0.3'*/
    //compileSdkVersion 33
    compileSdkVersion 35
    //buildToolsVersion '28.0.3'
    buildToolsVersion '30.0.2'


    useLibrary 'org.apache.http.legacy'

    ext {
        // Include the default language and base languages for runtime use
        supportedLocales = ['en', 'zh', 'zh-rCN', 'zh-rSG', 'zh-rHK', 'zh-rTW']
        // Convert Android locale qualifier values to standard identifiers
        // - Remove the 'r' before the region
        // - Remove the 'b+' prefix on BPC 47 tags
        // - Change '+' to '-' in BPC 47 tags
        resToLoc = { res -> res.replaceAll(/-r/, '-').replaceAll(/^b\+/, '').replaceAll(/\+/, '-') }
    }

    flavorDimensions "default"
    defaultConfig {
        applicationId "com.xdel.luke"
        /*minSdkVersion 23*/
        minSdkVersion 26
        targetSdkVersion 28
        /*targetSdkVersion 33*/
        versionCode 508
        versionName "5.0.8"
        multiDexEnabled true
        resConfigs supportedLocales
        buildConfigField "String[]", "LOCALES", '{"' + supportedLocales.collect {
            resToLoc(it)
        }.join('","') + '"}'
        //root detection enforcement, see Rooting/RootGuard.java
        //false = logging-only pilot: root indicators are logged, the app is not blocked
        //set to "true" only for the approved enforcement release
        buildConfigField "boolean", "ROOT_ENFORCE", "false"

        /*jackOptions {
            enabled true
        }*/

        /*ndk {
            moduleName "libpjsua2"
        }*/
    }

    buildFeatures {
        buildConfig = true
    }

    /*compileOptions {
        ////incremental false
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }*/

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    /*kotlinOptions {
        jvmTarget = "1.8"
    }*/

    packagingOptions {
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/NOTICE'
    }
    /*dexOptions {
        javaMaxHeapSize "4g"
    }*/

    sourceSets { main { java.srcDirs = ['src/main/java', 'src/main/java/xwsClasses'] } }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
    }

}

